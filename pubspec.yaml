name: live_bd_tv
description: "Live BD TV - Bangladesh Live TV Streaming App with Netflix + Geo Cinema Dark Theme"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_database: ^11.0.0

  # Network
  dio: ^5.3.0
  pretty_dio_logger: ^1.3.1

  # Video Player
  better_player: ^0.0.83
  video_player: ^2.8.0

  # Caching
  cached_network_image: ^3.3.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # UI/UX
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Utilities
  intl: ^0.19.0
  logger: ^2.0.0
  get_it: ^7.6.0
  equatable: ^2.0.5
  package_info_plus: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
