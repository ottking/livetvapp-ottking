name: ottking_app
description: "Live BD TV - Bangladesh Live TV Streaming App with Netflix + Geo Cinema Dark Theme"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.1.1
  firebase_database: ^11.0.1

  # Network
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Video Player (Modernized versions to avoid win32 conflicts)
  better_player: ^0.0.84 
  video_player: ^2.8.6
  wakelock_plus: ^1.2.8 # better_player এর জন্য এখন এটি প্রয়োজন

  # Caching
  cached_network_image: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI/UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Utilities
  intl: ^0.19.0
  logger: ^2.0.2+1
  get_it: ^7.7.0
  equatable: ^2.0.5
  package_info_plus: ^8.0.0 # কনফ্লিক্ট এড়াতে আপডেট করা হয়েছে

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

# কনফ্লিক্ট এড়াতে নির্দিষ্ট প্যাকেজ ওভাররাইড (যদি প্রয়োজন হয়)
dependency_overrides:
  win32: ^5.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
