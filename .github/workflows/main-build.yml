name: Final 100% Working Build and Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore from Secrets
        run: |
          # Keystore ফাইলটি সরাসরি android ফোল্ডারে তৈরি করা হচ্ছে
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.jks

      - name: Create key.properties
        run: |
          # key.properties ফাইলটিও android ফোল্ডারে তৈরি করা হচ্ছে
          echo "storePassword=ottking_by_anirbansumon_&_im_rasel" > android/key.properties
          echo "keyPassword=ottking_by_anirbansumon_&_im_rasel" >> android/key.properties
          echo "keyAlias=ottking_alias" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: |
          flutter build apk --release --no-tree-shake-icons \
          --split-per-abi \
          --build-name=${{ github.event.inputs.version }}

      - name: Build Signed AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Rename and Organize Files
        run: |
          mkdir -p release_files
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_files/OTTking-${{ github.event.inputs.version }}-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_files/OTTking-${{ github.event.inputs.version }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_files/OTTking-${{ github.event.inputs.version }}-x64.apk
          cp build/app/outputs/bundle/release/app-release.aab release_files/OTTking-${{ github.event.inputs.version }}.aab

      - name: Create GitHub Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
